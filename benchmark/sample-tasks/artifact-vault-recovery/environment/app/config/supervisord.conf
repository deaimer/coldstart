[unix_http_server]
file=/tmp/artifact-vault-supervisor.sock

[supervisord]
logfile=/logs/artifacts/supervisord.log
pidfile=/tmp/artifact-vault-supervisord.pid
childlogdir=/logs/artifacts
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/artifact-vault-supervisor.sock

[program:artifact-api]
command=/app/bin/artifact-vault api
directory=/app
autostart=true
autorestart=true
startsecs=1
stdout_logfile=/logs/artifacts/api.log
stderr_logfile=/logs/artifacts/api.err.log
environment=VAULT_API_CONFIG="/app/config/api.json"

[program:artifact-worker]
command=/app/bin/artifact-vault worker
directory=/app
autostart=true
autorestart=true
startsecs=1
stdout_logfile=/logs/artifacts/worker.log
stderr_logfile=/logs/artifacts/worker.err.log
environment=VAULT_WORKER_CONFIG="/app/config/worker.json"
